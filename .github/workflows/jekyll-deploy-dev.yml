name: Update dev

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-dev"
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ruby gems
        run: bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Move site into dev folder
        run: |
          mkdir dev
          cp -r _site/* dev/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dev

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
