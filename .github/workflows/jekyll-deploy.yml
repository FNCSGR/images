name: Update pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Build main
        working-directory: main
        run: |
          bundle install
          bundle exec jekyll build

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev

      - name: Build dev
        working-directory: dev
        run: |
          bundle install
          bundle exec jekyll build

      - name: Prepare Pages artifact
        shell: powershell
        run: |
          New-Item output -ItemType Directory -Force | Out-Null
          Copy-Item main\_site\* output\ -Recurse -Force
          New-Item output\dev -ItemType Directory -Force | Out-Null
          Copy-Item dev\_site\* output\dev\ -Recurse -Force

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: self-hosted
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
